apiVersion: 1

# Notification routing. The Supra node alerts (labelled team=supra-node) are routed
# to the Slack contact point defined in contactpoints.yaml. The root policy also
# defaults to Slack so nothing is silently dropped.
policies:
  - orgId: 1
    receiver: supra-slack
    group_by:
      - grafana_folder
      - alertname
    group_wait: 30s
    group_interval: 5m
    repeat_interval: 4h
    routes:
      - receiver: supra-slack
        object_matchers:
          - ["team", "=", "supra-node"]
        group_wait: 30s
        group_interval: 5m
        # Re-notify every hour while a node-health alert keeps firing.
        repeat_interval: 1h
